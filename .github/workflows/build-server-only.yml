name: Build Patched scrcpy-server

on:
  workflow_dispatch:

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Server with Gradle
        run: ./gradlew -p server assembleRelease

      - name: Rename and Upload artifact
        run: |
          mv server/build/outputs/apk/release/server-release-unsigned.apk scrcpy-server
      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-server
          path: scrcpy-server
